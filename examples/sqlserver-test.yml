---
# Application name for this connector configuration
app_name: SQL Server Test
app_description: Test configuration for SQL Server with random password generation and account provisioning

# Connection settings for the SQL Server database
connect:
  # Data Source Name (DSN) for our test SQL Server instance
  dsn: "sqlserver://${DB_HOST}:${DB_PORT}?database=${DB_DATABASE}"
  # Username and password are provided separately so they can be properly URL encoded.
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"

actions:
  update_user_attributes:
    name: Update User Attributes
    description: Update the attributes of a user. Only provide the attributes you want to update.
    action_type:
      - account
      - account_update_profile
    arguments:
      user_id:
        name: User ID
        type: string
        required: true
        description: The ID of the user to update
      attrs:
        name: Attributes
        type: string_map
        required: true
        description: The updated attribute data (map of attribute names to values)
      attrs_update_mask:
        name: Attributes Update Mask
        type: string_list
        required: true
        description: The attributes to update (list of attribute names from attrs to actually update)
    vars:
      # Map each attribute in the attrs argument to a variable and a flag to indicate if the attribute should be updated
      manager_id: "'manager_id' in input.attrs ? input.attrs['manager_id'] : null"
      update_manager_id: "'manager_id' in input.attrs_update_mask"
      first_name: "'first_name' in input.attrs ? input.attrs['first_name'] : null"
      update_first_name: "'first_name' in input.attrs_update_mask"
      middle_name: "'middle_name' in input.attrs ? input.attrs['middle_name'] : null"
      update_middle_name: "'middle_name' in input.attrs_update_mask"
      last_name: "'last_name' in input.attrs ? input.attrs['last_name'] : null"
      update_last_name: "'last_name' in input.attrs_update_mask"
      job_title: "'job_title' in input.attrs ? input.attrs['job_title'] : null"
      update_job_title: "'job_title' in input.attrs_update_mask"
      department: "'department' in input.attrs ? input.attrs['department'] : null"
      update_department: "'department' in input.attrs_update_mask"
      employee_id: "'employee_id' in input.attrs ? input.attrs['employee_id'] : null"
      update_employee_id: "'employee_id' in input.attrs_update_mask"
      employee_number: "'employee_number' in input.attrs ? input.attrs['employee_number'] : null"
      update_employee_number: "'employee_number' in input.attrs_update_mask"
    # We define the whole update logic with conditional attributes using CASE statements
    # Note: SQL Server examples has the attributes split between Users and EmployeeData tables
    queries: 
      - |
        -- Update Users table fields
        UPDATE Users
        SET
          ManagerID = CASE 
            WHEN ?<update_manager_id> = 1 THEN CAST(?<manager_id> AS INT)
            ELSE ManagerID
          END,
          EmployeeID = CASE 
            WHEN ?<update_employee_id> = 1 THEN ?<employee_id>
            ELSE EmployeeID
          END
        WHERE Username = ?<user_id>;
      - |
        -- Update EmployeeData table fields
        UPDATE ed
        SET
          attr_first_name = CASE 
            WHEN ?<update_first_name> = 1 THEN ?<first_name>
            ELSE ed.attr_first_name
          END,
          attr_middle_name = CASE 
            WHEN ?<update_middle_name> = 1 THEN ?<middle_name>
            ELSE ed.attr_middle_name
          END,
          attr_last_name = CASE 
            WHEN ?<update_last_name> = 1 THEN ?<last_name>
            ELSE ed.attr_last_name
          END,
          JobTitle = CASE 
            WHEN ?<update_job_title> = 1 THEN ?<job_title>
            ELSE ed.JobTitle
          END,
          Department = CASE 
            WHEN ?<update_department> = 1 THEN ?<department>
            ELSE ed.Department
          END,
          EmployeeNumber = CASE 
            WHEN ?<update_employee_number> = 1 THEN CAST(?<employee_number> AS INT)
            ELSE ed.EmployeeNumber
          END
        FROM (
          SELECT TOP 1 EmployeeDataID, UserID
          FROM EmployeeData
          WHERE UserID = (SELECT UserID FROM Users WHERE Username = ?<user_id>)
        ) ed_sub
        INNER JOIN EmployeeData ed ON ed.EmployeeDataID = ed_sub.EmployeeDataID

# Definition of different resource types managed by this connector
resource_types:
  # Configuration for "user" resources in SQL Server
  user:
    # Display name for this resource type
    name: "User"
    # Description providing context about what a user represents
    description: "A user within the SQL Server system"
    # Settings for listing user records from the database
    list:
      # SQL query to fetch user-related data including employee_id, last_login, and manager information
      query: |
        SELECT
          u.UserID as id, 
          u.Username as username,
          u.Email as email,
          u.EmployeeID as employee_id,
          CASE 
            WHEN u.IsActive = 1 THEN 'active'
            ELSE 'inactive'
          END as status,
          u.AccountType as account_type,
          u.CreatedAt as created_at,
          CASE 
            WHEN u.LastLogin IS NULL THEN ''
            ELSE FORMAT(u.LastLogin, 'yyyy-MM-ddTHH:mm:ssZ')
          END as last_login,
          u.ManagerID as manager_id,
          m.Username as manager_username,
          m.Email as manager_email,
          ed.attr_first_name,
          ed.attr_middle_name,
          ed.attr_last_name,
          ed.JobTitle as attr_job_title,
          ed.Department as attr_department,
          ed.EmployeeNumber as attr_employee_number
        FROM
          Users u
        LEFT JOIN 
          Users m ON u.ManagerID = m.UserID
        LEFT JOIN
          EmployeeData ed ON u.UserID = ed.UserID
        ORDER BY u.UserID
        OFFSET ?<Offset> ROWS FETCH NEXT ?<Limit> ROWS ONLY
      # Pagination configuration (using offset for SQL Server)
      pagination:
        strategy: "offset"
        primary_key: "id"
      # Mapping of query results to resource fields
      map:
        # Unique identifier for the user resource
        id: ".username"
        # Field to display as the resource's name
        display_name: ".username"
        # Additional description for the user resource
        description: ".username"
        # User-specific traits for detailed information
        traits:
          user:
            # User's email addresses (array format)
            emails:
              - ".email"
            # Account status (active, inactive, etc.)
            status: ".status"
            # Login identifier (usually username)
            login: ".username"
            # Last login timestamp
            last_login: ".last_login"
            # User profile information
            profile:
              employee_id: ".employee_id"
              account_type: ".account_type"
              created_at: ".created_at"
              manager_id: ".manager_id"
              manager_username: ".manager_username"
              manager_email: ".manager_email"
              attr_first_name: ".attr_first_name"
              attr_middle_name: ".attr_middle_name"
              attr_last_name: ".attr_last_name"
              attr_job_title: ".attr_job_title"
              attr_department: ".attr_department"
              attr_employee_number: ".attr_employee_number != null ? string(.attr_employee_number) : ''"

    # Account provisioning configuration for creating new user accounts
    account_provisioning:
      # Schema definition for required and optional fields during user creation
      schema:
        - name: "username"
          description: "The username for the new user"
          type: "string"
          placeholder: "new_user"
          required: true
        - name: "email"
          description: "Email address for the new user"
          type: "string"
          placeholder: "user@example.com"
          required: true
        - name: "employee_id"
          description: "Employee ID for the new user"
          type: "string"
          placeholder: "EMP001"
          required: false
      # Credential options for password management
      credentials:
        random_password:
          max_length: 32
          min_length: 16
          preferred: true
          # SQL Server CHECK_POLICY requires at least one character from each of:
          # uppercase, lowercase, digit, and non-alphanumeric.
          constraints:
            - char_set: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
              min_count: 2
            - char_set: "abcdefghijklmnopqrstuvwxyz"
              min_count: 2
            - char_set: "0123456789"
              min_count: 2
            - char_set: "!@#$%^&*"
              min_count: 1
        no_password:
          preferred: false
      # Validation query to check if user already exists
      validate:
        vars:
          username: "username"
          email: "email"
        query: |
          SELECT
            u.UserID as id, 
            u.Username as username,
            u.Email as email,
            u.EmployeeID as employee_id,
            CASE 
              WHEN u.IsActive = 1 THEN 'active'
              ELSE 'inactive'
            END as status,
            u.AccountType as account_type,
            u.CreatedAt as created_at,
            CASE 
              WHEN u.LastLogin IS NULL THEN ''
              ELSE FORMAT(u.LastLogin, 'yyyy-MM-ddTHH:mm:ssZ')
            END as last_login,
            u.ManagerID as manager_id,
            m.Username as manager_username,
            m.Email as manager_email,
            ed.attr_first_name,
            ed.attr_middle_name,
            ed.attr_last_name,
            ed.JobTitle as attr_job_title,
            ed.Department as attr_department,
            ed.EmployeeNumber as attr_employee_number
          FROM Users u
          LEFT JOIN Users m ON u.ManagerID = m.UserID
          LEFT JOIN EmployeeData ed ON u.UserID = ed.UserID
          WHERE u.Username = ?<username>
      # Account creation configuration
      create:
        vars:
          username: "input.username"
          email: "input.email"
          employee_id: "has(input.employee_id) ? input.employee_id : null"
          password: "password"
        queries:
          # Insert the new user with generated password (SQL Server style with HASHBYTES)
          - |
            INSERT INTO Users (Username, Email, EmployeeID, IsActive, AccountType, CreatedAt, PasswordHash) 
            VALUES (?<username>, ?<email>, ?<employee_id>, 1, 'human', GETDATE(), HASHBYTES('SHA2_256', ?<password>))

  # Configuration for "role" resources
  role:
    # Display name for the role resource type
    name: "Role"
    # Brief description of what a role signifies
    description: "A role within the SQL Server system"
    # Settings for listing roles from the database
    list:
      # SQL query to retrieve roles
      query: |
        SELECT
          RoleID as id,
          RoleName as role_name,
          Description as description
        FROM Roles
        ORDER BY RoleID
        OFFSET ?<Offset> ROWS FETCH NEXT ?<Limit> ROWS ONLY
      # Pagination settings for role listing
      pagination:
        strategy: "offset"
        primary_key: "id"
      # Field mappings for role data
      map:
        id: ".role_name"
        display_name: ".role_name"
        description: ".description"
        traits:
          role:
            profile:
              role_name: ".role_name"

    # Static entitlements that can be granted for roles
    static_entitlements:
      - id: "member"
        display_name: "resource.DisplayName + ' Membership'"
        description: "'Member of the ' + resource.DisplayName + ' role'"
        purpose: "assignment"
        grantable_to:
          - "user"
        # Provisioning settings for granting/revoking role membership
        provisioning:
          vars:
            username: "principal.ID"
            role_name: "resource.ID"
          grant:
            queries:
              - |
                INSERT INTO UserRoles (
                  UserID, 
                  RoleID
                ) 
                SELECT 
                  u.UserID, 
                  r.RoleID 
                FROM Users u, Roles r 
                WHERE u.Username = ?<username> 
                AND r.RoleName = ?<role_name>
          revoke:
            queries:
              - |
                DELETE ur FROM UserRoles ur
                INNER JOIN Users u ON ur.UserID = u.UserID
                INNER JOIN Roles r ON ur.RoleID = r.RoleID
                WHERE u.Username = ?<username>
                AND r.RoleName = ?<role_name>

    # Grant discovery for existing role assignments
    grants:
      - query: |
          SELECT 
            u.Username as username,
            r.RoleName as role_name
          FROM UserRoles ur
          INNER JOIN Users u ON ur.UserID = u.UserID
          INNER JOIN Roles r ON ur.RoleID = r.RoleID
          ORDER BY r.RoleID
          OFFSET ?<Offset> ROWS FETCH NEXT ?<Limit> ROWS ONLY
        map:
          - skip_if: ".role_name != resource.ID"
            principal_id: ".username"
            principal_type: "user"
            entitlement_id: "member"
        pagination:
          strategy: "offset"
          primary_key: "role_name"
