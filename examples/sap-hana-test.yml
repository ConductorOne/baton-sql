---
  app_name: HANA Express Test
  
  connect:
    dsn: "hdb://${DB_HOST}:${DB_PORT}/${DB_DATABASE}"
    # Username and password are provided separately so they can be properly URL encoded.
    user: "${DB_USER}"
    password: "${DB_PASSWORD}"
  
  incremental_sync:
    default_lookback: 3h

  resource_types:
    user:
      name: "User"
      description: "A user within the SAP HANA database"
      list:
        query: |
          SELECT
            USER_ID,
            "SYS"."USERS".USER_NAME AS USER_NAME,
            CASE 
              WHEN USER_DEACTIVATED = 'TRUE' THEN 'inactive'
              ELSE 'active'
            END as STATUS,
            CREATE_TIME,
            LAST_SUCCESSFUL_CONNECT,
            COMMENTS,
            VALUE AS EMAIL_ADDRESS
          FROM
            "SYS"."USERS"
            LEFT JOIN
              "USER_PARAMETERS"
              ON "SYS"."USERS".USER_NAME = "USER_PARAMETERS".USER_NAME
              AND "USER_PARAMETERS".PARAMETER = 'EMAIL ADDRESS'
          ORDER BY USER_ID
          LIMIT ?<Limit> OFFSET ?<Offset>
        # Pagination configuration
        pagination:
          strategy: "offset"
          primary_key: "USER_ID"
        # Mapping of query results to resource fields
        map:
          id: ".USER_ID"
          display_name: ".USER_NAME"
          description: ".USER_NAME"
          # Extra attributes (traits) for the user resource
          traits:
            user:
              status: .STATUS
              login: .USER_NAME
              # SYS and any username starting with _SYS is a system user. Everything else is a human user.
              account_type: 'cel:(cols["USER_NAME"] == "SYS" || string(cols["USER_NAME"]).startsWith("_SYS")) ? "system" : "human"'
              emails:
                - ".EMAIL_ADDRESS != null ? .EMAIL_ADDRESS : ''"
              last_login: ".LAST_SUCCESSFUL_CONNECT != null ? string(.LAST_SUCCESSFUL_CONNECT) : ''"
              created_at: ".CREATE_TIME != null ? string(.CREATE_TIME) : ''"
              profile:
                comments: ".COMMENTS != null ? .COMMENTS : ''"
                user_id: .USER_ID
                created_at: .CREATE_TIME
                last_login: .LAST_SUCCESSFUL_CONNECT

      # Fetches a single user by ID (required when incremental_sync is configured).
      get:
        query: |
          SELECT
            USER_ID,
            "SYS"."USERS".USER_NAME AS USER_NAME,
            CASE
              WHEN USER_DEACTIVATED = 'TRUE' THEN 'inactive'
              ELSE 'active'
            END as STATUS,
            CREATE_TIME,
            LAST_SUCCESSFUL_CONNECT,
            COMMENTS,
            VALUE AS EMAIL_ADDRESS
          FROM "SYS"."USERS"
          LEFT JOIN "USER_PARAMETERS"
            ON "SYS"."USERS".USER_NAME = "USER_PARAMETERS".USER_NAME
            AND "USER_PARAMETERS".PARAMETER = 'EMAIL ADDRESS'
          WHERE USER_ID = ?<id>

      # Detects newly created users via CREATE_TIME.
      # Note: SYS.USERS is a system catalog view. CREATE_TIME records when the user was
      # created; there is no general-purpose updated_at column, so this source detects
      # new accounts only. Profile changes (password, deactivation) are not captured.
      # SYS.USERGROUPS similarly has no modification timestamp; incremental sync is not
      # configured for the group resource type.
      incremental_sync:
        query: |
          SELECT
            USER_ID,
            "SYS"."USERS".USER_NAME AS USER_NAME,
            CASE
              WHEN USER_DEACTIVATED = 'TRUE' THEN 'inactive'
              ELSE 'active'
            END as STATUS,
            CREATE_TIME,
            LAST_SUCCESSFUL_CONNECT,
            COMMENTS,
            VALUE AS EMAIL_ADDRESS
          FROM "SYS"."USERS"
          LEFT JOIN "USER_PARAMETERS"
            ON "SYS"."USERS".USER_NAME = "USER_PARAMETERS".USER_NAME
            AND "USER_PARAMETERS".PARAMETER = 'EMAIL ADDRESS'
          WHERE CREATE_TIME > ?<since>
          ORDER BY CREATE_TIME ASC
          LIMIT ?<Limit> OFFSET ?<Offset>
        cursor_column: CREATE_TIME
        pagination:
          strategy: offset
          primary_key: USER_ID

    group:
      name: "Group"
      description: "A group within the SAP HANA database"
      list:
        query: |
          SELECT
            USERGROUP_NAME,
            USERGROUP_ID,
            CREATOR,
            IS_USER_ADMIN_ENABLED,
            IS_CLIENT_CONNECT_ENABLED,
            HAS_CONNECT_RESTRICTION,
            COMMENTS
          FROM
            "SYS"."USERGROUPS"
          ORDER BY USERGROUP_ID
          LIMIT ?<Limit> OFFSET ?<Offset>
        pagination:
          strategy: "offset"
          primary_key: "USERGROUP_ID"
        map:
          id: ".USERGROUP_ID"
          display_name: ".USERGROUP_NAME"
          description: ".USERGROUP_NAME"
          traits:
            group:
              profile:
                creator: ".CREATOR != null ? .CREATOR : ''"
                is_user_admin_enabled: .IS_USER_ADMIN_ENABLED
                is_client_connect_enabled: .IS_CLIENT_CONNECT_ENABLED
                has_connect_restriction: .HAS_CONNECT_RESTRICTION
                comments: ".COMMENTS != null ? .COMMENTS : ''"
      static_entitlements:
        - id: "member"
          display_name: "resource.DisplayName + ' Group Member'"
          description: "'Member of the ' + resource.DisplayName + ' group'"
          purpose: "assignment"
          grantable_to:
            - "user"
      grants:
        - vars:
            usergroup_id: "resource.ID"
          query: |
            SELECT
              USER_ID,
              USER_NAME,
              "SYS"."USERGROUPS".USERGROUP_NAME as USERGROUP_NAME
            FROM
              "SYS"."USERGROUPS"
              LEFT JOIN
                "SYS"."USERS"
                ON "SYS"."USERGROUPS".USERGROUP_NAME = "SYS"."USERS".USERGROUP_NAME
            WHERE "SYS"."USERGROUPS".USERGROUP_ID = ?<usergroup_id>
            ORDER BY USER_ID
            LIMIT ?<Limit> OFFSET ?<Offset>
          pagination:
            strategy: "offset"
            primary_key: "USER_ID"
          map:
            - principal_id: ".USER_ID"
              principal_type: "user"
              entitlement_id: "member"
