---
# Connector Configuration Reference
# ===================================
# This is a reference configuration demonstrating all available options
# and their purposes in a connector configuration file.

# The application name that identifies this connector
app_name: Example Application

# Connection Configuration
# ----------------------
# Specifies how to connect to the data source. Supports various connection methods.
#
# RECOMMENDED: Use structured fields!
connect:
  scheme: "mysql"
  host: "${DB_HOST}"
  port: "3306"
  database: "${DB_NAME}"
  user: "${DB_USER}"
  password: "${DB_PASS}"
  params:
    parseTime: "true"
#
# ALTERNATIVE: Use DSN with separate user/password fields
# connect:
#   dsn: "mysql://${DB_HOST}:3306/${DB_NAME}?parseTime=true"
#   user: "${DB_USER}"
#   password: "${DB_PASS}"
#
# LEGACY: Complete DSN (not recommended if credentials contain special characters)
# connect:
#   dsn: "mysql://${DB_USER}:${DB_PASS}@${DB_HOST}:3306/${DB_NAME}?parseTime=true"

# Event Feed Settings (Optional)
# ------------------------------
# Global settings for the event feed (incremental change detection).
# When any resource type or grants query has event_feed configured, the connector
# automatically exposes an EventFeed to ConductorOne for efficient change detection.
#
# Each poll re-reads rows from `overlap` before the last committed timestamp, so rows that share
# a timestamp or commit late are not missed. Re-read rows produce the same event IDs and are
# de-duplicated by ConductorOne. Event feed queries should filter with `>= ?<since>` and order by
# the cursor column plus the pagination primary key, so offset paging is stable.
event_feed:
  default_lookback: 3h   # How far back to look on first run; any Go duration string
  overlap: 60s           # How far before the committed cursor each poll starts; defaults to 60s

# Resource Types
# -------------
# Defines the resources that can be synchronized from the data source.
# Each resource type represents a distinct entity type (e.g., users, groups, roles).
resource_types:

  # Example User Resource
  # ---------------------
  user:
    name: "User"
    description: "Represents a user account in the system"

    # Targeted Sync — Get Query
    # -------------------------
    # Fetches a single resource by ID. Required when event_feed is configured
    # on this resource type. Uses the same list.map for column mapping.
    get:
      query: |
        SELECT id, username, email, created_at, status, department, updated_at
        FROM users
        WHERE id = ?<resource_id>

    # List Configuration
    # ------------------
    # Defines how to retrieve a paginated list of resources.
    list:
      query: |
        SELECT
          id,
          username,
          email,
          created_at,
          status,
          department,
          updated_at
        FROM users
        WHERE id > ?<Cursor>
        ORDER BY id ASC
        LIMIT ?<Limit>
      map:
        id: ".id"
        display_name: ".username"
        description: "string(.department) + ' department user'"
        traits:
          user:
            emails:
              - ".email"
            status: ".status"
            profile:
              department: ".department"
              joined_date: ".created_at"
              # Complex CEL transformation example
              full_name: "titleCase(.first_name) + ' ' + titleCase(.last_name)"
      pagination:
        strategy: "cursor"
        primary_key: "id"

    # Resource Event Feed
    # -------------------
    # Detects new/modified resources via timestamp filtering. Emits a ResourceChangeEvent
    # per row; C1 then calls the get query above to re-fetch the full resource.
    # ?<since> is automatically injected with the cursor timestamp for this source.
    event_feed:
      query: |
        SELECT id, username, email, created_at, status, department, updated_at
        FROM users
        WHERE updated_at >= ?<since>
        ORDER BY updated_at ASC, id ASC
        LIMIT ?<Limit> OFFSET ?<Offset>
      cursor_column: updated_at   # Column whose max value advances this source's cursor
      pagination:
        strategy: offset
        primary_key: id

    # Static Entitlements
    # -------------------
    # Pre-defined permissions that can be granted.
    static_entitlements:
      - id: "access"
        display_name: "Basic Access"
        description: "Provides basic access to the application"
        purpose: "assignment"
        grantable_to:
          - "user"
          - "service_account"
        provisioning:
          vars:
            user_id: "principal.ID"
            access_level: "'basic'"
          # Grant revives a soft-deleted row, or inserts a new one. Upsert syntax depends on
          # the database (e.g. ON CONFLICT in PostgreSQL, MERGE in SQL Server or Oracle).
          grant:
            queries:
              - |
                UPDATE user_access
                SET deleted_at = NULL, updated_at = CURRENT_TIMESTAMP
                WHERE user_id = ?<user_id> AND level = ?<access_level> AND deleted_at IS NOT NULL
              - |
                INSERT INTO user_access (user_id, level)
                SELECT ?<user_id>, ?<access_level> FROM DUAL
                WHERE NOT EXISTS (
                  SELECT 1 FROM user_access WHERE user_id = ?<user_id> AND level = ?<access_level>
                )
          # Revoke soft-deletes so the grants event feed's revokes_query can report it.
          revoke:
            queries:
              - |
                UPDATE user_access
                SET deleted_at = CURRENT_TIMESTAMP, updated_at = CURRENT_TIMESTAMP
                WHERE user_id = ?<user_id> AND deleted_at IS NULL

    # Grants Query Configuration
    # --------------------------
    # Defines how to discover existing entitlement assignments.
    grants:
      - query: |
          SELECT
            id AS grant_id,
            user_id,
            access_level,
            updated_at
          FROM user_access
          WHERE deleted_at IS NULL
          LIMIT ?<Limit> OFFSET ?<Offset>
        map:
          - skip_if: ".access_level != 'basic'"
            principal_id: ".user_id"
            principal_type: "user"
            entitlement_id: "access"
        pagination:
          strategy: "offset"
          primary_key: "grant_id"

        # Grants Event Feed
        # -----------------
        # Detects new and revoked grants without a full re-sync.
        # The parent map is reused for row-to-grant mapping.
        # NOTE: CEL expressions in map must not reference resource trait fields
        # (display_name, description, etc.) in this context — only row columns are available.
        event_feed:
          resource_id: ".user_id"   # CEL expr: extracts resource ID from each row
                                    # (required — event feed queries span ALL resources)
          changes_query: |
            SELECT id AS grant_id, user_id, access_level, updated_at
            FROM user_access
            WHERE deleted_at IS NULL
              AND updated_at >= ?<since>
            ORDER BY updated_at ASC, id ASC
            LIMIT ?<Limit> OFFSET ?<Offset>
          # updated_at must change on every insert and update (a trigger or ON UPDATE default).
          changes_cursor_column: updated_at

          # Optional: only configure when the table soft-deletes rows. Hard deletes can't be
          # detected. When set, the full-sync grants query must exclude soft-deleted rows, revoke
          # must soft-delete, and grant must revive a soft-deleted row (see provisioning above).
          revokes_query: |
            SELECT id AS grant_id, user_id, access_level, deleted_at
            FROM user_access
            WHERE deleted_at >= ?<since>
            ORDER BY deleted_at ASC, id ASC
            LIMIT ?<Limit> OFFSET ?<Offset>
          revokes_cursor_column: deleted_at

          pagination:
            strategy: offset
            primary_key: grant_id   # Must be present in both changes_query and revokes_query SELECTs

# Example: add groups, roles, applications, etc. following the same pattern.
