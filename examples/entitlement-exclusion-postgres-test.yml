---
# baton-sql config for the Entitlement Exclusion Groups E2E fixture.
#
# Three access levels on the same `database/<id>` resource that share an
# exclusion_group_id form one C1 AppEntitlementExclusionGroup; see
# entitlement-exclusion-fixture.sql for the full layout.
#
# NOTE: the `exclusion_group:` block on each entitlement mapping is the
# temporary shape described in the test plan. Upstream baton-sql does not
# yet decode it — once the local patch lands, it will protowire-encode the
# three fields into a `type.googleapis.com/c1.connector.v2.EntitlementExclusionGroup`
# Any. Until then, those keys are parsed as unknown YAML and ignored.

app_name: PostgreSQL Entitlement Exclusion Test
app_description: E2E fixture for AppEntitlementExclusionGroup support

connect:
  scheme: postgres
  host: localhost
  port: "5433"
  database: baton_exclusion
  user: baton
  password: baton
  params:
    sslmode: disable

resource_types:
  user:
    name: "User"
    description: "A user in the exclusion-group fixture"
    list:
      query: |
        SELECT username, email, status
        FROM users
      pagination:
        strategy: "offset"
        primary_key: "username"
      map:
        id: ".username"
        display_name: ".username"
        traits:
          user:
            login: ".username"
            status: ".status"
            emails:
              - ".email"

  database:
    name: "Database"
    description: "A database resource that grants access levels"
    list:
      query: |
        SELECT id, display_name
        FROM databases
      pagination:
        strategy: "offset"
        primary_key: "id"
      map:
        id: ".id"
        display_name: ".display_name"

    entitlements:
      vars:
        database_id: "resource.ID"
      query: |
        SELECT
          database_id,
          level_id,
          display_name,
          sort_order,
          is_default,
          exclusion_group_id
        FROM database_access_levels
        WHERE database_id = ?<database_id>
      pagination:
        strategy: "offset"
        primary_key: "level_id"
      map:
        - id: ".level_id"
          slug: ".level_id"
          display_name: ".display_name"
          description: "'Access level ' + .display_name + ' on ' + .database_id"
          purpose: "assignment"
          grantable_to:
            - "user"
          # TODO: not yet wired in upstream baton-sql — local patch will
          # protowire-encode these three fields into a
          # c1.connector.v2.EntitlementExclusionGroup Any annotation.
          exclusion_group:
            id: ".exclusion_group_id"
            order: ".sort_order"
            is_default: ".is_default"

    grants:
      - vars:
          database_id: "resource.ID"
        query: |
          SELECT database_id, username, level_id
          FROM database_user_access
          WHERE database_id = ?<database_id>
        pagination:
          strategy: "offset"
          primary_key: "username"
        map:
          - principal_id: ".username"
            principal_type: "user"
            entitlement_id: ".level_id"
