# baton-sql config for the Entitlement Exclusion Groups E2E fixture.
#
# Uses the temporary `exclusion_group:` block shape described in the test plan.
# When the SDK type lands and baton-sql gains first-party support, the shape
# may move under `annotations:` — the local baton-sql patch is expected to
# accept this shape and protowire-encode it into a
# `type.googleapis.com/c1.connector.v2.EntitlementExclusionGroup` Any.
#
# Three access levels on the same `database/<id>` resource that share an
# exclusion_group_id form one C1 AppEntitlementExclusionGroup; see fixture.sql
# for the full layout.

credentials:
  postgres:
    username: baton
    password: baton
    hostname: localhost
    port: 5433
    database: baton_exclusion
    sslmode: disable

resource_types:
  user:
    list:
      query: |
        SELECT username, email, status
        FROM users
    id: ".username"
    display_name: ".username"
    profile:
      email: ".email"
      login: ".username"
      status: ".status"

  database:
    list:
      query: |
        SELECT id, display_name
        FROM databases
    id: ".id"
    display_name: ".display_name"

    entitlements:
      dynamic:
        - query: |
            SELECT
              database_id,
              level_id,
              display_name,
              sort_order,
              is_default,
              exclusion_group_id
            FROM database_access_levels
            WHERE database_id = ?
          args:
            - ".id"
          slug: ".level_id"
          display_name: ".display_name"
          description: "\"Access level \" + .display_name + \" on \" + .database_id"
          grantable_to:
            - user
          purpose: assignment
          # Temporary shape — the local baton-sql patch protowire-encodes these
          # three fields into a c1.connector.v2.EntitlementExclusionGroup Any.
          exclusion_group:
            id: ".exclusion_group_id"
            order: ".sort_order"
            is_default: ".is_default"

    grants:
      - query: |
          SELECT database_id, username, level_id
          FROM database_user_access
          WHERE database_id = ?
        args:
          - ".id"
        entitlement: ".level_id"
        principal_type: user
        principal_id: ".username"
