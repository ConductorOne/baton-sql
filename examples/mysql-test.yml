---
# Application name for this connector configuration
app_name: MySQL Test
app_description: Test configuration for MySQL with account provisioning and random password generation

# Connection settings for the MySQL database
connect:
  # Data Source Name (DSN) for our local MySQL instance running in Docker
  dsn: "mysql://${DB_HOST}:${DB_PORT}/${DB_DATABASE}"
  # Username and password are provided separately so they can be properly URL encoded.
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"

actions:
  update_user_attributes:
    name: Update User Attributes
    description: Update the attributes of a user. Only provide the attributes you want to update.
    action_type:
      - account
      - account_update_profile
    arguments:
      user_id:
        name: User ID
        type: string
        required: true
        description: The ID of the user to update
      attrs:
        name: Attributes
        type: string_map
        required: true
        description: The updated attribute data (map of attribute names to values)
      attrs_update_mask:
        name: Attributes Update Mask
        type: string_list
        required: true
        description: The attributes to update (list of attribute names from attrs to actually update)
    vars:
      # Map each attribute in the attrs argument to a variable and a flag to indicate if the attribute should be updated
      manager_id: "'manager_id' in input.attrs ? input.attrs['manager_id'] : null"
      update_manager_id: "'manager_id' in input.attrs_update_mask"
      first_name: "'first_name' in input.attrs ? input.attrs['first_name'] : null"
      update_first_name: "'first_name' in input.attrs_update_mask"
      middle_name: "'middle_name' in input.attrs ? input.attrs['middle_name'] : null"
      update_middle_name: "'middle_name' in input.attrs_update_mask"
      last_name: "'last_name' in input.attrs ? input.attrs['last_name'] : null"
      update_last_name: "'last_name' in input.attrs_update_mask"
      display_name: "'display_name' in input.attrs ? input.attrs['display_name'] : null"
      update_display_name: "'display_name' in input.attrs_update_mask"
      job_title: "'job_title' in input.attrs ? input.attrs['job_title'] : null"
      update_job_title: "'job_title' in input.attrs_update_mask"
      department: "'department' in input.attrs ? input.attrs['department'] : null"
      update_department: "'department' in input.attrs_update_mask"
      division: "'division' in input.attrs ? input.attrs['division'] : null"
      update_division: "'division' in input.attrs_update_mask"
      company: "'company' in input.attrs ? input.attrs['company'] : null"
      update_company: "'company' in input.attrs_update_mask"
      employee_id: "'employee_id' in input.attrs ? input.attrs['employee_id'] : null"
      update_employee_id: "'employee_id' in input.attrs_update_mask"
      employee_number: "'employee_number' in input.attrs ? input.attrs['employee_number'] : null"
      update_employee_number: "'employee_number' in input.attrs_update_mask"
      employment_type: "'employment_type' in input.attrs ? input.attrs['employment_type'] : null"
      update_employment_type: "'employment_type' in input.attrs_update_mask"
    # We define the whole update logic with conditional attributes using CASE statements
    query: |
      UPDATE users
      SET
        manager_id = CASE 
          WHEN ?<update_manager_id> THEN ?<manager_id>
          ELSE manager_id
        END,
        attr_first_name = CASE 
          WHEN ?<update_first_name> THEN ?<first_name>
          ELSE attr_first_name
        END,
        attr_middle_name = CASE 
          WHEN ?<update_middle_name> THEN ?<middle_name>
          ELSE attr_middle_name
        END,
        attr_last_name = CASE 
          WHEN ?<update_last_name> THEN ?<last_name>
          ELSE attr_last_name
        END,
        attr_display_name = CASE 
          WHEN ?<update_display_name> THEN ?<display_name>
          ELSE attr_display_name
        END,
        attr_job_title = CASE 
          WHEN ?<update_job_title> THEN ?<job_title>
          ELSE attr_job_title
        END,
        attr_department = CASE 
          WHEN ?<update_department> THEN ?<department>
          ELSE attr_department
        END,
        attr_division = CASE 
          WHEN ?<update_division> THEN ?<division>
          ELSE attr_division
        END,
        attr_company = CASE 
          WHEN ?<update_company> THEN ?<company>
          ELSE attr_company
        END,
        employee_id = CASE 
          WHEN ?<update_employee_id> THEN ?<employee_id>
          ELSE employee_id
        END,
        attr_employee_number = CASE 
          WHEN ?<update_employee_number> THEN ?<employee_number>
          ELSE attr_employee_number
        END,
        attr_employment_type = CASE 
          WHEN ?<update_employment_type> THEN ?<employment_type>
          ELSE attr_employment_type
        END
      WHERE
        username = ?<user_id>

# Definition of different resource types managed by this connector
resource_types:
  # Configuration for "user" resources in MySQL
  user:
    # Display name for this resource type
    name: "User"
    # Description providing context about what a user represents
    description: "A user within the MySQL system"
    # Settings for listing user records from the database
    list:
      # SQL query to fetch user-related data including employee_id, last_login, and manager information
      query: |
        SELECT
          u.id, 
          u.username,
          u.email,
          u.employee_id,
          u.status,
          u.account_type,
          u.created_at,
          CASE 
            WHEN u.last_login IS NULL THEN ''
            ELSE DATE_FORMAT(u.last_login, '%Y-%m-%dT%H:%i:%sZ')
          END as last_login,
          u.manager_id,
          m.username as manager_username,
          m.email as manager_email,
          u.attr_first_name,
          u.attr_middle_name,
          u.attr_last_name,
          u.attr_display_name,
          u.attr_job_title,
          u.attr_department,
          u.attr_division,
          u.attr_company,
          u.attr_employee_number,
          u.attr_employment_type
        FROM
          users u
        LEFT JOIN 
          users m ON u.manager_id = m.id
      # Pagination configuration (using offset for MySQL)
      pagination:
        strategy: "offset"
        primary_key: "id"
      # Mapping of query results to resource fields
      map:
        # Unique identifier for the user resource
        id: ".username"
        # Field to display as the resource's name
        display_name: ".username"
        # Additional description for the user resource
        description: ".username"
        # Extra attributes (traits) for the user resource
        traits:
          user:
            # Map status from database (active, disabled) to proper resource status
            status: ".status"
            # Login identifier - username
            login: ".username"
            # Email addresses
            emails:
              - ".email"
            # Account type mapping
            account_type: ".account_type"
            # Employee ID mapping
            employee_ids:
              - ".employee_id"
            # Last login timestamp mapping
            last_login: ".last_login"
            # Manager information
            manager_id: ".manager_id"
            manager_email: ".manager_email"

            # Profile details for the user
            profile:
              user_id: ".id"
              created_at: ".created_at"
              last_login: ".last_login"
              manager_id: ".manager_id"
              manager_username: ".manager_username"
              manager_email: ".manager_email"
              attr_first_name: ".attr_first_name"
              attr_middle_name: ".attr_middle_name"
              attr_last_name: ".attr_last_name"
              attr_display_name: ".attr_display_name"
              attr_job_title: ".attr_job_title"
              attr_department: ".attr_department"
              attr_division: ".attr_division"
              attr_company: ".attr_company"
              attr_employee_number: ".attr_employee_number"
              attr_employment_type: ".attr_employment_type"

    # Account provisioning configuration with password support
    account_provisioning:
      schema:
        - name: "username"
          description: "The username for the new user"
          type: "string"
          placeholder: "new_user"
          required: true
        - name: "email"
          description: "Email address for the new user"
          type: "string"
          placeholder: "user@example.com"
          required: true
        - name: "employee_id"
          description: "Employee ID for the new user"
          type: "string"
          placeholder: "EMP001"
          required: false
      credentials:
        random_password:
          max_length: 32
          min_length: 16
          preferred: true
        no_password:
          preferred: false
      validate:
        vars:
          username: "username"
          email: "email"
        query: |
          SELECT
            u.id, 
            u.username,
            u.email,
            u.employee_id,
            u.status,
            u.account_type,
            u.created_at,
            CASE 
              WHEN u.last_login IS NULL THEN ''
              ELSE DATE_FORMAT(u.last_login, '%Y-%m-%dT%H:%i:%sZ')
            END as last_login,
            u.manager_id,
            m.username as manager_username,
            m.email as manager_email,
            u.attr_first_name,
            u.attr_middle_name,
            u.attr_last_name,
            u.attr_display_name,
            u.attr_job_title,
            u.attr_department,
            u.attr_division,
            u.attr_company,
            u.attr_employee_number,
            u.attr_employment_type
          FROM users u
          LEFT JOIN users m ON u.manager_id = m.id
          WHERE u.username = ?<username>
      create:
        vars:
          username: "input.username"
          email: "input.email"
          employee_id: "has(input.employee_id) ? input.employee_id : null"
          password: "password"
        queries:
          # Insert the new user with generated password
          - |
            INSERT INTO users (username, email, employee_id, status, account_type, created_at, password_hash) 
            VALUES (?<username>, ?<email>, ?<employee_id>, 'active', 'human', NOW(), SHA2(?<password>, 256))

  # Configuration for "role" resources
  role:
    # Display name for the role resource type
    name: "Role"
    # Brief description of what a role signifies
    description: "A role within the MySQL system"
    # Settings for listing roles from the database
    list:
      # SQL query to retrieve roles
      query: |
        SELECT
          id,
          role_name
        FROM
          roles
      # Pagination configuration
      pagination:
        strategy: "offset"
        primary_key: "id"
      # Mapping of each query result to role resource fields
      map:
        # Unique role identifier
        id: ".role_name"
        # Display name for the role
        display_name: ".role_name"
        # Role description
        description: ".role_name"
        # Additional role-specific traits
        traits:
          role:
            # Profile mapping for the role
            profile:
              role_id: ".id"

    # Define a static entitlement for role membership
    static_entitlements:
      - id: "member"
        display_name: "'Member'"
        description: "'Role member'"
        purpose: "assignment"
        grantable_to:
          - "user"

    # Dynamic grants based on SQL queries to associate users with roles
    grants:
      - query: |
          SELECT 
            u.username,
            r.role_name
          FROM 
            users u
          JOIN 
            user_roles ur ON u.id = ur.user_id
          JOIN 
            roles r ON r.id = ur.role_id
        pagination:
          strategy: "offset"
          primary_key: "username"
        map:
          - skip_if: ".role_name != resource.ID"
            principal_id: ".username"
            principal_type: "user"
            entitlement_id: "member"
