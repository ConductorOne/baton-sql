---
app_name: Vertica Test
app_description: Test configuration for Vertica database
connect:
  dsn: "vertica://${DB_HOST}:${DB_PORT}/${DB_DATABASE}?tlsmode=none"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"

incremental_sync:
  default_lookback: 3h

resource_types:
  user:
    name: "User"
    description: "A user within the Vertica system"
    list:
      query: |
        SELECT
          u.id,
          u.username,
          u.email,
          u.employee_id,
          u.status,
          u.account_type,
          u.created_at,
          u.last_login,
          u.manager_id,
          m.username as manager_username
        FROM
          users u
        LEFT JOIN
          users m ON u.manager_id = m.id
      pagination:
        strategy: "offset"
        primary_key: "id"
      map:
        id: ".username"
        display_name: ".username"
        description: ".username"
        traits:
          user:
            status: ".status"
            login: ".username"
            emails:
              - ".email"
            account_type: ".account_type == 'employee' ? 'human' : .account_type"
            employee_ids:
              - ".employee_id"
            last_login: ".last_login != null ? string(.last_login) : ''"
            profile:
              user_id: ".id"
              created_at: ".created_at"
              last_login: ".last_login != null ? string(.last_login) : ''"
              manager_id: ".manager_id"
              manager_username: ".manager_username"

    # Fetches a single user by ID (required when incremental_sync is configured).
    get:
      query: |
        SELECT
          u.id,
          u.username,
          u.email,
          u.employee_id,
          u.status,
          u.account_type,
          u.created_at,
          u.last_login,
          u.manager_id,
          m.username as manager_username
        FROM users u
        LEFT JOIN users m ON u.manager_id = m.id
        WHERE u.username = ?<id>

    # Detects new and modified users via updated_at.
    incremental_sync:
      query: |
        SELECT
          u.id,
          u.username,
          u.email,
          u.employee_id,
          u.status,
          u.account_type,
          u.created_at,
          u.last_login,
          u.manager_id,
          m.username as manager_username,
          u.updated_at
        FROM users u
        LEFT JOIN users m ON u.manager_id = m.id
        WHERE u.updated_at > ?<since>
        ORDER BY u.updated_at ASC
        LIMIT ?<Limit> OFFSET ?<Offset>
      cursor_column: updated_at
      pagination:
        strategy: offset
        primary_key: id

  role:
    name: "Role"
    description: "A role within the Vertica system"
    list:
      query: |
        SELECT
          id,
          role_name
        FROM
          roles
      pagination:
        strategy: "offset"
        primary_key: "id"
      map:
        id: ".role_name"
        display_name: ".role_name"
        description: "'Vertica role: ' + .role_name"
        traits:
          role:
            profile:
              role_id: ".id"

    # Fetches a single role by ID (required when incremental_sync is configured).
    get:
      query: |
        SELECT id, role_name
        FROM roles
        WHERE role_name = ?<id>

    # Detects new and modified roles via updated_at.
    incremental_sync:
      query: |
        SELECT id, role_name, updated_at
        FROM roles
        WHERE updated_at > ?<since>
        ORDER BY updated_at ASC
        LIMIT ?<Limit> OFFSET ?<Offset>
      cursor_column: updated_at
      pagination:
        strategy: offset
        primary_key: id

    static_entitlements:
      - id: "member"
        display_name: "'Member'"
        description: "'Role member'"
        purpose: "assignment"
        grantable_to:
          - "user"

    grants:
      - query: |
          SELECT
            u.username,
            r.role_name
          FROM
            users u
          JOIN
            user_roles ur ON u.id = ur.user_id
          JOIN
            roles r ON r.id = ur.role_id
        pagination:
          strategy: "offset"
          primary_key: "username"
        map:
          - skip_if: ".role_name != resource.ID"
            principal_id: ".username"
            principal_type: "user"
            entitlement_id: "member"

        # Detects new role assignments and soft-deleted revokes.
        incremental_sync:
          resource_id: ".role_name"
          changes_query: |
            SELECT
              ur.id AS grant_id,
              u.username,
              r.role_name,
              ur.updated_at
            FROM user_roles ur
            JOIN users u ON u.id = ur.user_id
            JOIN roles r ON r.id = ur.role_id
            WHERE ur.deleted_at IS NULL
              AND ur.updated_at > ?<since>
            ORDER BY ur.updated_at ASC
            LIMIT ?<Limit> OFFSET ?<Offset>
          changes_cursor_column: updated_at
          revokes_query: |
            SELECT
              ur.id AS grant_id,
              u.username,
              r.role_name,
              ur.deleted_at
            FROM user_roles ur
            JOIN users u ON u.id = ur.user_id
            JOIN roles r ON r.id = ur.role_id
            WHERE ur.deleted_at > ?<since>
            ORDER BY ur.deleted_at ASC
            LIMIT ?<Limit> OFFSET ?<Offset>
          revokes_cursor_column: deleted_at
          pagination:
            strategy: offset
            primary_key: grant_id
